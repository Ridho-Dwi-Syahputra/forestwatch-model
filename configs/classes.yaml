# Definisi 6 kelas tutupan lahan ForestWatch Papua (PRD §A.3)
# Single source of truth — kelas, warna, dan bobot loss dipakai di semua modul.

classes:
  - id: 0
    name: "Perairan"
    name_en: "Water"
    color: "#2A6FDB"
    rgb: [42, 111, 219]
    weight: 0.8
    description: "Sungai, danau, laut, rawa, vegetasi tergenang"

  - id: 1
    name: "Hutan"
    name_en: "Forest"
    color: "#0B3D0B"
    rgb: [11, 61, 11]
    weight: 0.4
    description: "Hutan alami (primer dan sekunder digabung)"

  - id: 2
    name: "Deforestasi"
    name_en: "Deforestation/Bare"
    color: "#E03B24"
    rgb: [224, 59, 36]
    weight: 2.0
    description: "Area yang dulunya hutan, kini gundul atau terdegradasi"

  - id: 3
    name: "Sawit"
    name_en: "Oil Palm"
    color: "#F97316"
    rgb: [249, 115, 22]
    weight: 2.0
    description: "Perkebunan kelapa sawit (industri & rakyat)"

  - id: 4
    name: "Pertanian Lain"
    name_en: "Other Agriculture"
    color: "#E9C46A"
    rgb: [233, 196, 106]
    weight: 1.0
    description: "Padi, jagung, sagu, semak, rumput, terbangun"

  - id: 5
    name: "Lahan Terbakar"
    name_en: "Burned"
    color: "#6D4C41"
    rgb: [109, 76, 65]
    weight: 2.5
    description: "Area dengan tanda bakar (dNBR tinggi)"

# Warna untuk 4 jenis transisi deforestasi (PRD §B.1.3 catatan)
transitions:
  hutan_ke_lahan_terbuka:
    color: "#7F1D1D"
    label: "Hutan → Lahan Terbuka"
    target_class: 2
  hutan_ke_sawit:
    color: "#F97316"
    label: "Hutan → Sawit"
    target_class: 3
  hutan_ke_pertanian_lain:
    color: "#EAB308"
    label: "Hutan → Pertanian Lain"
    target_class: 4
  hutan_ke_terbakar:
    color: "#6D4C41"
    label: "Hutan → Lahan Terbakar"
    target_class: 5
