# Default hyperparameters ForestWatch Papua
# Override per-eksperimen dengan file YAML lain atau env vars.

project:
  name: "ForestWatch Papua"
  gee_project_id: "forestwatch-papua-unand"
  seed: 42

# Geografis
area:
  # Bounding box seluruh Papua (6 provinsi). Sesuai PRD §A.5 Cell 3.
  papua_bbox: [130.0, -9.5, 141.2, 0.5]  # [minLon, minLat, maxLon, maxLat]
  crs: "EPSG:4326"

# Periode pembanding (untuk deteksi perubahan)
periods:
  t1: 2021
  t2: 2024

# Sentinel-2 input
sentinel2:
  asset_id: "COPERNICUS/S2_SR_HARMONIZED"
  bands: ["B2", "B3", "B4", "B8", "B11", "B12"]
  scale: 10                  # meter per piksel
  cloud_threshold: 40        # % cloudy pixel maksimum sebelum filter
  scl_mask_classes: [3, 8, 9, 10, 11]  # bayangan, awan, salju → buang
  reflectance_divisor: 10000

# Label fusion (PRD §A.4) — ambang batas
label_fusion:
  hansen_loss_year_min: 19   # tahun 2019 ke atas (lossyear >= 19)
  hansen_erosion_pixels: 1   # morphological erosion radius
  dnbr_threshold: 0.27       # ambang lahan terbakar
  default_class_id: 4        # inisialisasi: Pertanian Lain

# Ekspor ubin GEE
export:
  tiles_nx: 6                # grid kolom
  tiles_ny: 6                # grid baris (total 36 ubin)
  max_pixels: 1.0e13
  file_format: "GeoTIFF"

# Patch extraction
patches:
  size: 256                  # patch size (pixel)
  stride: 256                # stride (256 = non-overlapping)
  max_nan_ratio: 0.3         # buang patch dengan > 30% NaN
  n_channels_image: 6        # 6 band Sentinel-2
  n_channels_label: 1

# Model
model:
  architecture: "unet"       # "unet" | "unet_scse" (attention upgrade)
  encoder_name: "resnet50"
  encoder_weights: "imagenet"
  in_channels: 6
  classes: 6
  activation: null           # null = logits (softmax di loss)

# Training
training:
  batch_size: 8
  num_workers: 2
  epochs: 50
  patience: 10               # early stopping
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  amp: true                  # automatic mixed precision
  loss:
    ce_weight: 0.6
    dice_weight: 0.4
  augmentation:
    horizontal_flip_p: 0.5
    vertical_flip_p: 0.5
    rotate_90_p: 0.5
  split:
    train_ratio: 0.8
    val_ratio: 0.1
    test_ratio: 0.1

# Inference
inference:
  patch_size: 256
  stride: 256                # 256 = non-overlapping; turunkan untuk overlap blend

# Change detection
change_detection:
  source_class: 1            # Hutan
  min_area_ha: 0.5           # buang polygon < 0.5 ha (noise)
  target_classes:            # 4 jenis transisi (PRD §A.5 Cell 9)
    2: "hutan_ke_lahan_terbuka"
    3: "hutan_ke_sawit"
    4: "hutan_ke_pertanian_lain"
    5: "hutan_ke_terbakar"

# Outputs (7 file kontrak — PRD §B.1)
outputs:
  filenames:
    landcover_t1_png: "landcover_2021.png"
    landcover_t1_bounds: "landcover_2021_bounds.json"
    landcover_t2_png: "landcover_2024.png"
    landcover_t2_bounds: "landcover_2024_bounds.json"
    deforestation_geojson: "deforestation.geojson"
    statistics_json: "statistics.json"
    legend_json: "legend.json"
    metrics_json: "metrics.json"
    model_onnx: "model.onnx"
    model_card: "model_card.md"
