[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestwatch"
version = "0.1.0"
description = "ForestWatch Papua - segmentasi tutupan lahan & deteksi deforestasi berbasis Sentinel-2"
readme = "README.md"
requires-python = ">=3.8"   # 3.8 utk Jetson Orin / JetPack 5.x (Ubuntu 20.04)
license = { text = "MIT" }
authors = [
    { name = "ForestWatch Papua Team (Universitas Andalas)" },
]
keywords = ["remote-sensing", "deforestation", "papua", "sentinel-2", "deep-learning", "satria-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24,<3",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "shapely>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
gee = [
    "earthengine-api>=0.1.380",
    "geemap>=0.30",
]
gis = [
    "rasterio>=1.3",
    "geopandas>=0.14",
    "fiona>=1.9",
    "pyproj>=3.6",
]
ml = [
    "torch>=2.1",
    "torchvision>=0.16",
    "segmentation-models-pytorch>=0.3.3",
    "albumentations>=1.3",
    "torchmetrics>=1.2",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "onnx>=1.15",
    "onnxruntime>=1.16",
]
# Jetson Orin (JetPack 5.x): torch/torchvision/onnxruntime DISEDIAKAN JetPack (wheel
# aarch64+CUDA dari NVIDIA) -- JANGAN di-install via pip (akan menimpa build CUDA).
# Install deps ML lain saja: pip install -e ".[jetson]". torch 2.1 JetPack memenuhi pin smp.
jetson = [
    "segmentation-models-pytorch>=0.3.3",
    "albumentations>=1.3",
    "torchmetrics>=1.2",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "onnx>=1.15",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]
all = [
    "forestwatch[gee,gis,ml,dev]",
]

[project.scripts]
fw-validate = "forestwatch.cli.validate:main"
fw-dummy = "forestwatch.cli.dummy:main"

[project.urls]
Documentation = "https://github.com/USER/forestwatch-papua-model#readme"
Repository = "https://github.com/USER/forestwatch-papua-model"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"forestwatch" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "gee: tests yang butuh akses Google Earth Engine (di-skip default)",
    "gpu: tests yang butuh CUDA (di-skip jika tidak tersedia)",
    "slow: tests lambat (di-skip default kecuali --runslow)",
]

[tool.ruff]
line-length = 100
target-version = "py38"   # selaras requires-python; cegah auto-fix UP menyuntik sintaks py310

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
